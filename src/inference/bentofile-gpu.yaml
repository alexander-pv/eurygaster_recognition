service: "service:erg"  # Same as the argument passed to `bentoml serve`
labels:
  owner: alexander-pv
  stage: prod
include:
  - "service.py"
  - "publisher.py"
  - "transform.py"
python:
  packages:  # Synced with pyproject.toml, Python 3.10 (GPU)
    - numpy>=1.26,<3
    - Pillow>=10.0.0
    - onnx>=1.14.0,<1.17
    - onnxruntime-gpu>=1.14.0,<1.25
    - aio-pika>=9.6.1
    - nest-asyncio>=1.6.0
    - fastapi>=0.90.0,<0.94.0
docker:
  distro: debian
  python_version: "3.10"
  cuda_version: "11.4"
