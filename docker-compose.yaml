
networks:
  eurygaster:
    name: eurygaster
#    external: true
#    driver: bridge
#    ipam:
#      config:
#        - subnet: ${SUBNET}/${MASK}
#          gateway: ${GATEWAY}
  keycloak:
    external: true

volumes:
  rabbitmq_data:
  entries_data:


services:

  eurygaster-svc:
    image: alrdockerhub/eurygaster-svc:${SVC_TAG}
    environment:
      RMQ_ADDR: ${RMQ_ADDR}
      RMQ_TOPIC: ${RMQ_TOPIC}
#    ports:
#      - "3000:3000"
    networks:
      - eurygaster
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: ${SVC_CPUS:-1}
          memory: ${SVC_MEM:-4096M}

  eurygaster-webpage:
    image: alrdockerhub/eurygaster-webpage-v2:${WEBPAGE_TAG}
    # build:
    #   context: ./src/webpage_v2
    #   dockerfile: Dockerfile
    #   args:
    #     VITE_INFERENCE_SERVER_ADDRESS: ${SVC_INFERENCE_ADDRESS}
    #     VITE_ENTRIES_SERVER_ADDRESS: ${ENTRIES_SERVER_ADDRESS}
    #     VITE_BINARY_THRESHOLD: ${BINARY_THRESHOLD:-0.5}
    #     VITE_AUTH_URL: ${AUTH_URL}
    #     VITE_AUTH_REALM: ${AUTH_REALM}
    #     VITE_AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
    volumes:
      - ./src/webpage_v2/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src/webpage_v2/public/image:/usr/share/nginx/html/image:ro
    expose:
      - "4452"
    networks:
      eurygaster:
    restart: on-failure
    depends_on:
      - eurygaster-svc
    deploy:
      resources:
        limits:
          cpus: ${WEBPAGE_CPUS:-1}
          memory: ${WEBPAGE_MEM:-4096M}

  entries_server:
    image: alrdockerhub/eurygaster-entries:${ENTRIES_TAG}
    environment:
      ENTRIES_DATABASE: /data/entries.db
      LIMIT_ENTRIES: 30
      CLEAR_TIMING_MIN: 5
      SERVER_PORT: ${ENTRIES_PORT}
#    ports:
#      - "${ENTRIES_PORT}:${ENTRIES_PORT}"
    volumes:
      - entries_data:/data
    networks:
      - eurygaster
    restart: always
    deploy:
      resources:
        limits:
          cpus: ${ENTRIES_CPUS:-1}
          memory: ${ENTRIES_MEM:-4096M}

  nginx:
    image: nginx:stable-alpine3.19
    ports:
      - "443:443"
      - "80:80"   # ACME challenge (certbot)
    volumes:
      # Production: Let's Encrypt (option 1A: identity on 443, no 8443)
      - ./src/nginx/webpage_letsencrypt.conf:/etc/nginx/conf.d/webpage_letsencrypt.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
      # Local/dev: file-based certs
      # - ./src/nginx/webpage.conf:/etc/nginx/conf.d/webpage.conf
      # - ./src/nginx/tests/webpage.crt:/secrets/eurygaster-webpage.crt
      # - ./src/nginx/tests/webpage.key:/secrets/eurygaster-webpage.key
      # - ./src/identity/server.crt.pem:/secrets/identity.crt
      # - ./src/identity/server.key.pem:/secrets/identity.key
    networks:
      - eurygaster
      - keycloak
    restart: always
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPUS:-1}
          memory: ${NGINX_MEM:-4096M}

  rabbitmq:
    image: rabbitmq:${RMQ_TAG}
    hostname: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PWD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit disk_free_limit 1147483648
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eurygaster
    restart: always
    deploy:
      resources:
        limits:
          cpus: ${RMQ_CPUS:-1}
          memory: ${RMQ_MEM:-4096M}

  queue_handler:
    image: alrdockerhub/eurygaster-queue_handler:${QUEUE_HANDLER_TAG}
    environment:
      LOGURU_LEVEL: DEBUG
      LOGURU_INIT: 1
      RMQ_ADDR: ${RMQ_ADDR}
      RMQ_TOPIC: NewImages
      STORAGE_TYPE: telegram # minio, telegram
      MINIO_ADDR: ${MINIO_ADDR}
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_GROUP_ID: ${TG_GROUP_ID}
    networks:
      - eurygaster
    restart: always
    depends_on:
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: ${QUEUE_HANDLER_CPUS:-1}
          memory: ${QUEUE_HANDLER_MEM:-4096M}
